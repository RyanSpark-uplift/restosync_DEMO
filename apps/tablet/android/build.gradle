// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Inject CMAKE_SUPPRESS_REGENERATION=ON into every native module's CMake build.
// CMake 3.22.1 + ninja 1.10.2 (NDK 27) otherwise emit a RERUN_CMAKE rule that
// ninja considers perpetually dirty, failing with "build.ninja still dirty after
// 100 tries". Suppressing the auto-regeneration rule breaks that loop; the initial
// configure (and RN codegen, which runs as separate Gradle tasks) is unaffected.
subprojects { sp ->
  sp.afterEvaluate {
    def androidExt = sp.extensions.findByName("android")
    if (androidExt != null) {
      androidExt.defaultConfig.externalNativeBuild.cmake.arguments(
        "-DCMAKE_SUPPRESS_REGENERATION=ON",
        // pnpm's hashed store paths get mirrored into object-file paths, blowing past
        // Windows' 260-char limit (ninja 1.10.2 isn't long-path aware). Forcing a low
        // CMAKE_OBJECT_PATH_MAX makes CMake emit short hashed object dirs instead.
        "-DCMAKE_OBJECT_PATH_MAX=240"
      )
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
